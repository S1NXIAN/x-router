# Personal fork blueprint — deploys X-Router to the Render free tier.
# No persistent disk (paid-only): the filesystem is ephemeral, so config
# survives redeploys via the Supabase remote-config mirror (SUPABASE_*);
# local telemetry (usage/logs) resets on redeploy by design.
# Free tier sleeps on inactivity; expect a cold start on wake.
# After the first deploy, set BASE_URL and NEXT_PUBLIC_BASE_URL to the
# service's onrender.com URL to pin the canonical origin for auth callbacks
# (code falls back to x-forwarded headers, so this is belt-and-braces).
services:
  - type: web
    name: x-router
    runtime: docker
    plan: free
    branch: dev
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: MACHINE_ID_SALT
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
